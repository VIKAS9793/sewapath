<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, follow" />
    <title>Page Not Found | SewaPath</title>
    <link rel="stylesheet" href="/seo-guide.css" />
    <style>
      .error-container {
        text-align: center;
        padding: 60px 20px;
        min-height: 60vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
      }
      .error-container h1 {
        font-size: 48px;
        color: var(--sewa-text);
        margin-bottom: 16px;
      }
      .error-container p {
        font-size: 18px;
        color: var(--sewa-muted);
        margin-bottom: 32px;
        max-width: 500px;
      }
      .home-btn {
        display: inline-block;
        background-color: var(--sewa-text);
        color: #fff;
        padding: 14px 24px;
        border-radius: 12px;
        text-decoration: none;
        font-weight: 600;
        font-size: 16px;
        transition: background-color 0.2s ease;
      }
      .home-btn:hover {
        background-color: #333;
      }
    </style>
  </head>
  <body>
    <div class="guide-container">
      <header class="guide-header">
        <div class="brand">
          <img src="/assets/sewapath/logo-lockup.svg" alt="SewaPath" />
        </div>
      </header>
      
      <main class="error-container">
        <h1>404</h1>
        <p><strong>Page not found</strong> / <strong>पृष्ठ आढळले नाही</strong> / <strong>पृष्ठ नहीं मिला</strong></p>
        <p>The page you are looking for might have been removed, had its name changed, or is temporarily unavailable.</p>
        <a href="/" class="home-btn">Return to SewaPath</a>
      </main>

      <footer class="guide-footer">
        <span><a href="/purpose/">Purpose</a> · <a href="/privacy/">Privacy</a> · <a href="/safety/">Safety</a> · <a href="/accessibility/">Accessibility</a></span>
      </footer>
    </div>
  </body>
</html>
